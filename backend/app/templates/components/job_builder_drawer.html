<!-- Multi-Operation Job Program Sequencer / Builder Drawer -->
<div id="jobBuilderDrawer" class="modal" style="display: none; position: fixed; z-index: 9997; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); justify-content: flex-end;">
  <div class="card" style="width: 540px; max-width: 95vw; height: 100vh; background: var(--bg-card); border-left: 1px solid var(--border-color); border-radius: 0; box-shadow: -10px 0 35px rgba(0,0,0,0.6); display: flex; flex-direction: column; padding: 1.25rem; overflow-y: auto;">
    
    <!-- Drawer Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1rem;">
      <h2 style="margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
        <span>📋 Multi-Operation Job Builder</span>
        <span class="badge" id="jobQueueHeaderCount" style="font-size: 0.75rem; background: var(--primary-color); color: white; padding: 0.2rem 0.5rem; border-radius: 9999px;">0 Ops</span>
      </h2>
      <button type="button" id="closeJobDrawerBtn" style="background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer;">&times;</button>
    </div>

    <!-- Job Configuration Settings -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.75rem;">
      <div style="grid-column: span 2;">
        <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Job Program Name</label>
        <input type="text" id="jobProgramName" value="Part_Machining_Job" style="width: 100%; padding: 0.35rem 0.5rem; font-size: 0.85rem;">
      </div>
      <div>
        <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 0.2rem;">Safe Retract Z (mm)</label>
        <input type="number" id="jobSafeZ" value="5.0" step="1.0" style="width: 100%; padding: 0.35rem 0.5rem; font-size: 0.85rem;">
      </div>
      <div style="display: flex; align-items: center; gap: 0.5rem; padding-top: 1rem;">
        <input type="checkbox" id="jobOptimizeTools">
        <label for="jobOptimizeTools" style="font-size: 0.75rem; color: var(--text-color); cursor: pointer;" title="Groups operations by tool number to minimize tool changes">Group by Tool</label>
      </div>
    </div>

    <!-- Mesh Leveling Toggle & Status Card -->
    <div style="margin-bottom: 1rem; background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.75rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="checkbox" id="jobApplyMeshLeveling">
          <label for="jobApplyMeshLeveling" style="font-size: 0.8rem; font-weight: 600; color: var(--text-main); cursor: pointer;">🌐 Workpiece Mesh Leveling</label>
        </div>
        <button type="button" id="jobOpenMeshModalBtn" class="btn btn-secondary btn-sm" style="font-size: 0.7rem; padding: 0.2rem 0.5rem;">🎯 Mesh Mapper</button>
      </div>
      <div id="jobMeshStatusBadge" style="font-size: 0.72rem; color: var(--text-muted);">
        ○ No Active Mesh. Click "Mesh Mapper" to sample or configure.
      </div>
    </div>

    <!-- Operation Queue List -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
      <span style="font-size: 0.8rem; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Queued Operations</span>
      <button type="button" id="btnClearJobQueue" class="btn btn-secondary btn-sm" style="font-size: 0.7rem; padding: 0.2rem 0.5rem; color: #ef4444;">🗑️ Clear All</button>
    </div>

    <div id="jobQueueEmptyState" style="text-align: center; padding: 2rem 1rem; background: rgba(15, 23, 42, 0.4); border: 1px dashed var(--border-color); border-radius: 6px; margin-bottom: 1rem;">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">📥</div>
      <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-color);">Job Queue is Empty</div>
      <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Navigate to any conversational machining page and click <strong>"➕ Add to Job Queue"</strong> to build your multi-op part program.</div>
    </div>

    <div id="jobQueueList" style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; flex: 1; overflow-y: auto;">
      <!-- Dynamically populated cards -->
    </div>

    <!-- Generate & Export Actions -->
    <div style="display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
      <button type="button" class="btn btn-primary" id="btnGenerateFullJob" style="font-weight: 700; width: 100%;">⚡ Generate Unified Program (.nc)</button>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" id="btnCopyJobGcode" disabled>📋 Copy Program</button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnDownloadJobGcode" disabled>💾 Download .nc</button>
      </div>
    </div>

    <!-- Output Stats & G-Code Preview -->
    <div id="jobOutputContainer" style="display: none; margin-top: 1rem;">
      <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #38bdf8; font-family: var(--font-mono); margin-bottom: 0.4rem;">
        <span id="jobStatLines">Lines: 0</span>
        <span id="jobStatToolChanges">Tool Changes: 0</span>
        <span id="jobStatTools">Tools: 0</span>
      </div>
      <textarea id="jobGcodeOutput" readonly rows="8" style="width: 100%; font-family: var(--font-mono); font-size: 0.75rem; background: #090d16; border: 1px solid var(--border-color); border-radius: 6px; padding: 0.5rem; color: #a5f3fc; resize: vertical;"></textarea>
    </div>

  </div>
</div>
