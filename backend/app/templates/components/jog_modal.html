<!-- Manual Jog Controller & Live DRO Modal / Floating Pendant -->
<div id="jogModal" class="modal" style="display: none; position: fixed; z-index: 9998; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); align-items: center; justify-content: center;">
  <div class="modal-content card" style="max-width: 620px; width: 92%; max-height: 90vh; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); padding: 1.25rem;">
    
    <!-- Modal Header -->
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1rem;">
      <h2 style="margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;">
        <span>🕹️ Manual Jog Controller & Live DRO</span>
      </h2>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <span class="badge" id="jogStatusBadge" style="background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold;">IDLE (G54)</span>
        <button type="button" id="closeJogModalBtn" style="background: none; border: none; font-size: 1.5rem; color: var(--text-muted); cursor: pointer;">&times;</button>
      </div>
    </div>

    <!-- Live Digital Readout (DRO) -->
    <div style="background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 0.85rem 1rem; margin-bottom: 1.25rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.4rem;">
        <span style="font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em;">Work Coordinates (WPos)</span>
        <span style="font-size: 0.75rem; color: #64748b;" id="droUnitsLabel">Metric (mm)</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; text-align: center; font-family: var(--font-mono);">
        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.25rem;">
          <div style="font-size: 0.7rem; color: #ef4444; font-weight: bold;">X AXIS</div>
          <div id="droPosX" style="font-size: 1.35rem; font-weight: 700; color: #f8fafc;">0.000</div>
        </div>
        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.25rem;">
          <div style="font-size: 0.7rem; color: #10b981; font-weight: bold;">Y AXIS</div>
          <div id="droPosY" style="font-size: 1.35rem; font-weight: 700; color: #f8fafc;">0.000</div>
        </div>
        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.25rem;">
          <div style="font-size: 0.7rem; color: #38bdf8; font-weight: bold;">Z AXIS</div>
          <div id="droPosZ" style="font-size: 1.35rem; font-weight: 700; color: #f8fafc;">0.000</div>
        </div>
      </div>
    </div>

    <!-- Jog Pad and Z Column Controls -->
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 1.25rem; align-items: center; margin-bottom: 1.25rem;">
      
      <!-- 8-Way XY Jog Pad -->
      <div style="display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center;">
        <button type="button" class="btn btn-secondary jog-btn" data-axis="-XY" title="Jog Diagonal (-X +Y)" style="font-size: 1rem; padding: 0;">↖</button>
        <button type="button" class="btn btn-secondary jog-btn" data-axis="Y" data-dir="1" title="Jog +Y (Back/Away)" style="font-size: 1.1rem; font-weight: bold; padding: 0; color: #10b981;">+Y</button>
        <button type="button" class="btn btn-secondary jog-btn" data-axis="XY" title="Jog Diagonal (+X +Y)" style="font-size: 1rem; padding: 0;">↗</button>

        <button type="button" class="btn btn-secondary jog-btn" data-axis="X" data-dir="-1" title="Jog -X (Left)" style="font-size: 1.1rem; font-weight: bold; padding: 0; color: #ef4444;">-X</button>
        <button type="button" class="btn btn-secondary" id="btnZeroXYCenter" title="Zero XY Origin" style="font-size: 0.75rem; font-weight: bold; padding: 0; background: #1e293b; color: #94a3b8;">X/Y 0</button>
        <button type="button" class="btn btn-secondary jog-btn" data-axis="X" data-dir="1" title="Jog +X (Right)" style="font-size: 1.1rem; font-weight: bold; padding: 0; color: #ef4444;">+X</button>

        <button type="button" class="btn btn-secondary jog-btn" data-axis="-X-Y" title="Jog Diagonal (-X -Y)" style="font-size: 1rem; padding: 0;">↙</button>
        <button type="button" class="btn btn-secondary jog-btn" data-axis="Y" data-dir="-1" title="Jog -Y (Forward)" style="font-size: 1.1rem; font-weight: bold; padding: 0; color: #10b981;">-Y</button>
        <button type="button" class="btn btn-secondary jog-btn" data-axis="X-Y" title="Jog Diagonal (+X -Y)" style="font-size: 1rem; padding: 0;">↘</button>
      </div>

      <!-- Vertical Divider -->
      <div style="width: 1px; height: 160px; background: var(--border-color);"></div>

      <!-- Z-Axis Vertical Column & Quick Zero Buttons -->
      <div style="display: flex; flex-direction: column; gap: 0.5rem; align-items: stretch;">
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
          <button type="button" class="btn btn-secondary jog-btn" data-axis="Z" data-dir="1" style="height: 52px; flex: 1; font-weight: bold; font-size: 1.1rem; color: #38bdf8;" title="Jog Z Up (+Z)">+Z (Up)</button>
          <button type="button" class="btn btn-secondary jog-btn" data-axis="Z" data-dir="-1" style="height: 52px; flex: 1; font-weight: bold; font-size: 1.1rem; color: #38bdf8;" title="Jog Z Down (-Z)">-Z (Down)</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; margin-top: 0.25rem;">
          <button type="button" class="btn btn-secondary btn-sm" id="btnZeroAllWcs" style="font-size: 0.75rem;">🎯 Zero XYZ</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnZeroZOnly" style="font-size: 0.75rem;">📏 Zero Z</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btnGotoOrigin" style="font-size: 0.75rem; grid-column: span 2; background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); color: #38bdf8;">🏠 Go To Origin (X0 Y0)</button>
        </div>
      </div>

    </div>

    <!-- Step Distance & Feed Rate Settings -->
    <div style="background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.75rem; margin-bottom: 1rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
        <span style="font-size: 0.8rem; font-weight: 600; color: #94a3b8;">Step Distance (mm)</span>
        <div style="display: flex; gap: 0.35rem;" id="stepIncrementButtonGroup">
          <button type="button" class="btn btn-secondary btn-sm step-btn" data-step="0.01">0.01</button>
          <button type="button" class="btn btn-secondary btn-sm step-btn" data-step="0.1">0.1</button>
          <button type="button" class="btn btn-secondary btn-sm step-btn" data-step="1.0">1.0</button>
          <button type="button" class="btn btn-secondary btn-sm step-btn active" data-step="10.0">10</button>
          <button type="button" class="btn btn-secondary btn-sm step-btn" data-step="50.0">50</button>
          <button type="button" class="btn btn-secondary btn-sm step-btn" data-step="100.0">100</button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem;">
        <span style="font-size: 0.8rem; font-weight: 600; color: #94a3b8;">Jog Feed Rate</span>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <input type="range" id="jogFeedSlider" min="100" max="5000" step="100" value="1200" style="width: 140px;">
          <span id="jogFeedLabel" style="font-family: var(--font-mono); font-size: 0.8rem; width: 85px; text-align: right; color: var(--text-color);">1200 mm/min</span>
        </div>
      </div>
    </div>

    <!-- Spindle & Machine Safety Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; border-top: 1px solid var(--border-color); padding-top: 0.85rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm" id="btnToggleSpindle" style="font-size: 0.8rem;">⚡ Spindle: OFF</button>
        <input type="number" id="jogSpindleRpm" value="16000" step="1000" style="width: 90px; padding: 0.25rem 0.4rem; font-size: 0.8rem;" title="Spindle RPM">
      </div>
      <div style="font-size: 0.75rem; color: var(--text-muted);">
        <span>⌨️ Hotkeys: <strong>Arrows (XY)</strong> | <strong>PgUp/Dn (Z)</strong> | <strong>Shift (5x)</strong></span>
      </div>
    </div>

    <!-- Last Command Output Display -->
    <div style="margin-top: 0.85rem;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem;">
        <span style="font-size: 0.7rem; color: #64748b; font-family: var(--font-mono);">LAST G-CODE COMMAND:</span>
        <span id="jogLastCmd" style="font-size: 0.75rem; color: #38bdf8; font-family: var(--font-mono);">$J=G91 G21 X0 F1200.0</span>
      </div>
    </div>

  </div>
</div>
